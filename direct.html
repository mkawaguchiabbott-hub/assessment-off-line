<title>栄養スクリーニング・アセスメント判定シート(直接チェック版)</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#1d2733;--mu:#667585;--ac:#0f766e;--bd:#d5dce3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181e;--card:#1b242d;--tx:#e8edf2;--mu:#93a1af;--ac:#2dd4bf;--bd:#34424f}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column}
.tb{background:var(--card);border-bottom:1px solid var(--bd);padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb p{margin:0;flex-basis:100%;font-size:12px;color:var(--mu)}
button{font:inherit;font-size:14px;font-weight:600;padding:9px 12px;border-radius:9px;border:1px solid var(--ac);background:var(--card);color:var(--ac)}
button.p{background:var(--ac);color:#fff;margin-left:auto}
#vw{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px}
#pg{position:relative;width:100%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25);margin:0 auto}
#bg{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.cb{position:absolute;padding:0;border:0;background:transparent;color:#d10000;font-weight:900;font-size:calc(var(--k,1)*14px);line-height:1;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:rgba(15,118,110,.3);border-radius:3px}
.cb.d{pointer-events:none}
.ip{position:absolute;border:0;border-radius:2px;background:rgba(15,118,110,.10);color:#000;font-size:calc(var(--k,1)*10px);padding:0 2px;font-family:inherit}
.lbl{position:absolute;display:flex;align-items:center;font-weight:700;color:#000;font-size:calc(var(--k,1)*8px);white-space:nowrap;pointer-events:none}
.pt{position:absolute;padding:0;border:0;border-radius:2px;background:rgba(15,118,110,.10);color:#000;font-size:calc(var(--k,1)*7.5px);font-weight:600;white-space:nowrap;line-height:1}
#mc{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}#mc[hidden],#mr[hidden],#ts[hidden],#fo[hidden]{display:none}
#fo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:12px;overflow:auto}
#fo .mb{max-width:420px;max-height:100%;overflow:auto}#fo .mb p{color:#1d2733;font-size:13px;margin:0 0 8px;text-align:left}#fo .mb button{margin-top:6px}
#fl{display:block;text-align:center;text-decoration:none;font-weight:600;padding:10px;border-radius:9px;background:var(--ac);color:#fff;margin-bottom:6px}#fo .mb img{margin:8px 0 0}
@media print{@page{size:A4;margin:0}body>*:not(#fo){display:none!important}#fo{position:static;background:#fff;padding:0;display:block!important}#fo .mb{max-width:none;max-height:none;padding:0;border-radius:0}#fo .mb p,#fo .mb a,#fo .mb button{display:none!important}#fo .mb img{width:100%;margin:0;border-radius:0}}
#ts{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--card);color:var(--tx);border:1px solid var(--ac);border-radius:14px;padding:8px 8px 8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:14px;font-weight:600;animation:tsup .35s ease-out;cursor:pointer}
#ts img{width:38px;height:38px;object-fit:cover;object-position:50% 30%;border-radius:50%;flex:none;background:#fff}
#ts span{flex:1}#tc{padding:4px 9px;font-size:13px;border-radius:50%}
@keyframes tsup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mb{background:#fff;border-radius:14px;padding:10px;text-align:center;max-width:320px;width:100%}.mb img{width:100%;border-radius:8px;display:block;margin-bottom:8px}.mb button{width:100%}
#mr{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:50%;width:52px;height:52px;padding:0;font-size:24px}
</style></head><body>
