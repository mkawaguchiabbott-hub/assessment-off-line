<style>:root{--bg:#f4f6f8;--card:#fff;--tx:#1d2733;--mu:#667585;--ac:#0f766e;--bd:#d5dce3}@media(prefers-color-scheme:dark){:root{--bg:#12181e;--card:#1b242d;--tx:#e8edf2;--mu:#93a1af;--ac:#2dd4bf;--bd:#34424f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}

<h1>栄養スクリーニング・アセスメント判定シート</h1><p>MUSTとGLIM基準で、低栄養を判定します。入力内容は端末の外へ送信されません。</p>
<a class="c" href="direct.html"><b>直接チェック版</b><span>元のシートを見ながら、□を直接タップして入力します</span></a>
<a class="c" href="form.html"><b>入力フォーム版</b><span>ステップごとに項目を入力し、完成シートを作ります</span></a>
<div class="st" id="st">オフライン準備中…(初回はネットに接続してください)</div>
<small>【端末に入れる方法】iPhone/iPad:Safariで開き、共有ボタン→「ホーム画面に追加」。パソコン:Chrome/Edgeのアドレスバー右のインストールボタン。追加後は、圏外でも開けます。</small></main>
<script>const st=document.getElementById('st');if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));navigator.serviceWorker.ready.then(()=>{st.textContent='オフラインで使えます';st.className='st ok'})}else st.textContent='この環境ではオフライン機能を使えません'</script></body></html>
